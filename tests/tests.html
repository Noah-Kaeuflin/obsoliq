  <meta charset="utf-8">

  <title>ObsoliQ Test Suite</title>
  <style>
    :root {
      color-scheme: light;
      --text: #082b54;
      --muted: #66758c;
      --border: #d8e0ea;
      --surface: #ffffff;
      --bg: #f4f7fb;
      --ok: #0f8b5f;
      --fail: #c93838;
    }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px;
    }
    .suite-header,
    .summary,
    .result {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(8, 43, 84, 0.06);
    }
    .suite-header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 22px;
    }
    p {
      margin: 6px 0 0;
      color: var(--muted);
    }
    button {
      height: 38px;
      border: 1px solid #b9c7d9;
      border-radius: 8px;
      padding: 0 14px;
      color: var(--text);
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .summary {
      margin-top: 16px;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .summary span {
      color: var(--muted);
    }
    .summary strong {
      font-variant-numeric: tabular-nums;
    }
    .results {
      list-style: none;
      margin: 16px 0 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    .result {
      padding: 12px 14px;
      display: grid;
      gap: 5px;
    }
    .result.pass {
      border-left: 4px solid var(--ok);
    }
    .result.fail {
      border-left: 4px solid var(--fail);
    }
    .result-title {
      font-weight: 800;
    }
    .result-meta {
      color: var(--muted);
      font-size: 13px;
    }
    .error {
      color: var(--fail);
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }
    iframe {
      width: 1px;
      height: 1px;
      border: 0;
      position: fixed;
      left: -9999px;
      top: -9999px;
    }
  </style>
</head>
